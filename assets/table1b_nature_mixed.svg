<text x="9" y="424" class="caption" font-family="Helvetica" font-size="15" font-weight="400">* ICLR 2026 human-rating proxy: per-paper mean rating &gt;5 is Accept, ties at 5 are Reject, and the mean rating is used for AUC; intervals use</text>
<text x="9" y="447" class="caption" font-family="Helvetica" font-size="15" font-weight="400">5,000 stratified paper-level bootstrap replicates. This is not an independent human-vs-human consistency test. For ICLR 2026 rows, ± is half</text>
<text x="9" y="470" class="caption" font-family="Helvetica" font-size="15" font-weight="400">the full 95% percentile-interval width; exact asymmetric bounds remain in the source JSON. † ICLR 2025 rows are copied from Nature Table 1;</text>
<text x="9" y="493" class="caption" font-family="Helvetica" font-size="15" font-weight="400">Always reject is deterministic and AI ± values are as published. ‡ The NeurIPS 2021 Human row uses a different dataset and has no reported CI.</text>
