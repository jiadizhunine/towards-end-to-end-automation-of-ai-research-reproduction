[project]
name = "deepseek-autoreviewer"
version = "0.1.0"
description = "Auditable five-review ensemble and meta-review pipeline for scientific papers"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "httpx>=0.28.1",
  "openai>=1.109.0",
  "pyarrow>=18.0.0",
  "pymupdf>=1.24.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
deepseek-autoreviewer = "deepseek_autoreviewer.cli:main"
iclr2026-autoreviewer = "deepseek_autoreviewer.benchmark_cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_autoreviewer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
